<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GrantFlow Assistant</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header>
      <h1>GrantFlow</h1>
      <button id="scanBtn">Draft & Fill</button>
    </header>
    <main>
      <section>
        <h2>Application</h2>
        <div id="fields" class="summary muted">Open a form page, then draft and fill.</div>
        <div class="button-row">
          <button id="reviewBtn" class="secondary" disabled>Review</button>
          <button id="pickQuestionBtn" class="secondary">Pick & Fill</button>
        </div>
        <div id="reviewLog" class="review muted">Review results will appear here.</div>
      </section>
      <section>
        <h2>Ask GrantFlow</h2>
        <div id="chatLog" class="chat muted">Ask a question to get one direct response.</div>
        <textarea id="chatInput" placeholder="Ask about this application..."></textarea>
        <button id="askBtn">Ask</button>
      </section>
      <section>
        <h2>Status</h2>
        <details>
          <summary id="statusSummary">Ready</summary>
          <div id="statusDetails" class="muted">Diagnostics stay summarized for demo use.</div>
        </details>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
